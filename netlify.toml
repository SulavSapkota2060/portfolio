# Netlify settings. This is a plain static site: no build step, and the repo root is what gets published.
[build]
  publish = "."

# Security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Images rarely change, so let browsers keep them for a week.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Keep the resume PDF out of search results (it has a phone number on it).
[[headers]]
  for = "/resume.pdf"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
